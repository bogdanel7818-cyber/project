<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Balul Bobocilor L.T.N</title>
  <meta name="description" content="Vot Balul Bobocilor – No Filter Night" />
  <style>
  :root {
    --bg: #080d18;
    --panel: #111827;
    --accent: #e4b85f;
    --accent-2: #ffe3a0;
    --text: #fff8e9;
    --muted: #c4b99f;
    --line: rgba(228,184,95,.32);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at 50% 10%, rgba(30,54,88,.72), transparent 52%),
      radial-gradient(ellipse at 12% 82%, rgba(121,70,31,.24), transparent 38%),
      linear-gradient(145deg, #080d18, #111827 52%, #090d17);
    min-height: 100vh;
  }
  .wrap {
    position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 34px 24px 10px;
    min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: 24px;
  }
  .card {
    position: relative; overflow: hidden; padding: 30px;
    background: linear-gradient(150deg, rgba(26,35,52,.96), rgba(12,18,30,.97) 72%);
    border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 0 0 5px rgba(228,184,95,.035);
  }
  .card::before { content: ''; position: absolute; inset: 9px; border: 1px solid rgba(228,184,95,.14); border-radius: 17px; pointer-events: none; }
  .title { font-size: clamp(30px, 6vw, 42px); font-weight: 700; letter-spacing: 1.5px; text-align: center; color: var(--accent-2); text-shadow: 0 2px 18px rgba(228,184,95,.25); }
  .subtitle { text-align: center; color: var(--muted); margin-top: 8px; font-family: system-ui, sans-serif; font-size: 14px; }
  .badge { display: table; background: linear-gradient(135deg, #f0cd7e, #bd8735); color: #17131a; padding: 7px 16px; border-radius: 999px; font: 800 12px system-ui, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; margin: 14px auto 0; text-align: center; box-shadow: 0 0 22px rgba(228,184,95,.16); }
  form { display: grid; gap: 16px; margin-top: 14px; position: relative; z-index: 1; }
  label { display: block; margin-bottom: 7px; font: 700 13px system-ui, sans-serif; letter-spacing: .3px; color: #f4ddb0; }
  input[type="text"], select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(228,184,95,.25); background: rgba(7,12,21,.8); color: var(--text); outline: none; font: 15px system-ui, sans-serif; transition: border .2s, box-shadow .2s; }
  input[type="text"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(228,184,95,.13); }
  select option { background: #111827; color: var(--text); }
  button { padding: 15px 18px; border-radius: 13px; border: 1px solid #f6d991; background: linear-gradient(135deg, #f1ce7f, #bc8738); color: #17131a; font: 800 15px system-ui, sans-serif; letter-spacing: 1.1px; text-transform: uppercase; cursor: pointer; transition: transform .15s ease, filter .15s ease, box-shadow .15s ease; box-shadow: 0 8px 24px rgba(185,130,48,.22); }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 11px 28px rgba(185,130,48,.3); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .68; cursor: wait; }
  .footer { text-align: center; color: var(--muted); font: 12px/1.6 system-ui, sans-serif; margin-top: 18px; }
  .logo { text-align:center; margin-bottom: 12px; }
  .logo .moon { width: 112px; height: 112px; border-radius: 50%; position: relative; margin: 0 auto 14px; border: 3px solid #d7a94f; background: radial-gradient(circle, #17345a 0 31%, #b17b32 32% 35%, #12213b 36% 53%, #d7a94f 54% 57%, #121d30 58%); box-shadow: 0 0 0 6px rgba(215,169,79,.1), 0 0 35px rgba(228,184,95,.24), inset 0 0 24px #000; }
  .logo .moon::before { content: '✦'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #f7d487; font-size: 33px; text-shadow: 0 0 12px #f4c75f; }
  .logo .moon::after { content: 'XII  •  III  •  VI  •  IX'; position: absolute; inset: 9px; border: 1px solid rgba(245,210,132,.46); border-radius: 50%; color: #f5d284; font: 700 8px Georgia,serif; letter-spacing: 4px; display: flex; align-items: flex-start; justify-content: center; padding-top: 2px; }
  .sparkle { position: absolute; width: 5px; height: 5px; background: #fff0ba; top: 18%; left: 18%; transform: rotate(45deg); box-shadow: 0 0 12px #f2c45e; z-index: 1; }
  .sparkle::after, .sparkle::before { content:""; position: absolute; background: #fff0ba; }
  .sparkle::after { width: 5px; height: 5px; top: -7px; left: 0; transform: rotate(45deg); }
  .sparkle::before { width: 5px; height: 5px; top: 7px; left: 0; transform: rotate(45deg); }
  .hr { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 22px 0 18px; }
  .success { background: rgba(20,75,49,.35); border: 1px solid #4e9e6a; color: #c1f4d0; padding: 12px; border-radius: 10px; font: 14px system-ui,sans-serif; }
  .error { background: rgba(93,34,34,.35); border: 1px solid #b76559; color: #ffd1c8; padding: 12px; border-radius: 10px; font: 14px system-ui,sans-serif; }
  .hidden { display: none; }
  .pair { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  footer { text-align: center; color: var(--muted); font: 13px system-ui,sans-serif; margin-top: 24px; padding: 0 16px 25px; }
  footer p { margin: 0; color: var(--text); }
  footer .socials { margin-top: 12px; display: flex; justify-content: center; gap: 22px; }
  footer .socials a { color: #d7b873; font-size: 23px; transition: color .25s, transform .2s; }
  footer .socials a:hover { color: #fff0bd; transform: scale(1.15); }
  .small { font: 12px system-ui,sans-serif; color: var(--muted); margin-top: 6px; }
  #particles { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; background: radial-gradient(circle at top left, rgba(18,30,50,.34), transparent 55%); }
  @media (max-width: 560px) { .pair { grid-template-columns: 1fr; } .wrap { padding: 18px 14px 4px; } .card { padding: 25px 20px; } }
</style>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <div class="moon">
          <div class="sparkle" style="top:22%; left:68%"></div>
          <div class="sparkle" style="top:66%; left:34%"></div>
        </div>
      </div>
      <div class="title">Balul Bobocilor</div>
      <div class="subtitle">Votează-ți favoriții • Valabil doar cu <b>codul unic</b> de pe bilet</div>
      <div class="badge">Vot deschis</div>

      <div class="hr"></div>

      <form id="voteForm">
        <div>
          <label for="code">Cod unic (de pe bilet)</label>
          <input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" placeholder="Ex: G4T2K8" required maxlength="12" />
          <div class="small">Fiecare cod poate fi folosit o singură dată.</div>
        </div>

        <div class="pair">
          <div>
            <label for="boboc">Boboc</label>
            <select id="boboc" name="boboc" required>
              <option value="" disabled selected>— alege —</option>
              <option>Dârvăreanu Dragoș Constantin</option>
              <option>Jitaru Rares Ionut</option>
              <option>Nițu Ioanis Ostian</option>
              <option>Vărzaru Radu</option>
            </select>
          </div>
          <div>
            <label for="boboaca">Boboacă</label>
            <select id="boboaca" name="boboaca" required>
              <option value="" disabled selected>— alege —</option>
              <option>Mutu Petronela Maia</option>
              <option>Nicolae Anca Elena</option>
              <option>Roșoiu Antonia Petruța</option>
              <option>Rădoi Miruna Maria</option>
            </select>
          </div>
        </div>

        <button id="submitBtn" type="submit">Votează</button>
        <div id="msg" class="hidden"></div>
      </form>

      <div class="footer">Liceul Teoretic Novaci • Vot valid doar în sală • Un cod = un vot</div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>
      Made with <span style="color: red;">♥</span> by <strong>Darius Cosoreci & Bogdan Predescu!</strong>
    </p>
    <div class="socials">
      <a href="https://www.instagram.com/darius_cosoreci/" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://github.com/DariusC007" target="_blank" aria-label="GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://www.instagram.com/bogdy.bgd/" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>
  </footer>


  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwC2Gn00bSW2LfL-A3K-5v_spFr0JI7KQCqNju1aRQV44cb3rEXH8Po1EITr4WK-IaK/exec";

    const form = document.getElementById('voteForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showStatus(text, type='success'){
      msg.className = type === 'success' ? 'success' : 'error';
      msg.textContent = text; 
      msg.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.classList.add('hidden');

      const code = document.getElementById('code').value.trim().toUpperCase();
      const boboc = document.getElementById('boboc').value;
      const boboaca = document.getElementById('boboaca').value;

      if(!code || !boboc || !boboaca){
        showStatus('Completează toate câmpurile.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Se trimite…';

      try {
        const payload = { code, boboc, boboaca };

        const response = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({ code, boboc, boboaca })
        });

        const result = await response.json();

        if (!result.ok) {
          showStatus(result.error || "Eroare necunoscuta.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = 'Votează';
          return;
        }

        showStatus("Mulțumim! Votul tău a fost înregistrat.");
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Votează';

      } catch (err) {
        showStatus("Eroare la server. Încearcă din nou.", "error");
        submitBtn.disabled = false;
        submitBtn.textContent = 'Votează';
      }
    });

  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function createParticles() {
    const count = 120;
    particles = [];

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,

        r: Math.random() * 2.2 + 0.8,
        color: Math.random() > 0.5 ? '#e4b85f' : '#d7e5ff',
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        opacity: Math.random() * 0.5 + 0.3,
      });
    }
  }
  createParticles();

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.opacity;
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
  </script>
</body>
</html>
